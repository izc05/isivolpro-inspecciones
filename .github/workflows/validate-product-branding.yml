name: Validate Preinspecciones BT product branding

on:
  push:
    branches:
      - feat/apk-pc-sync-gps-close
    paths:
      - src/App.jsx
      - scripts/harden-preinspection-branding.mjs
      - .github/workflows/validate-product-branding.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: isivoltpro-bt-product-branding
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/apk-pc-sync-gps-close
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Apply idempotent product branding patch
        run: node scripts/harden-preinspection-branding.mjs

      - name: Validate connected application
        run: npm run test:integration

      - name: Synchronize Android
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Check visible product identity
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'const APP_VERSION = "1.5.8";' src/App.jsx
          grep -Fq 'sub: "PREINSPECCIONES BT"' src/App.jsx
          grep -Fq 'Beta local-first' src/App.jsx
          grep -Fq 'mailto:info@isivoltpro.com?subject=Soporte Preinspecciones BT' src/App.jsx
          grep -Fq 'Enviar comentarios sobre la beta' src/App.jsx
          if grep -Fq '600 123 456' src/App.jsx; then
            echo 'The demonstration phone number is still visible.' >&2
            exit 1
          fi
          if grep -Fq 'soporte@isivolt.com' src/App.jsx; then
            echo 'The obsolete support address is still visible.' >&2
            exit 1
          fi
          git diff --check

      - name: Write product branding validation marker
        shell: bash
        run: |
          cat > docs/product-branding-validation.md <<'EOF'
          # Validación · Identidad visible de Preinspecciones BT

          Estado: **SUPERADA**

          Se ha comprobado conjuntamente:

          - versión visible `1.5.8` coherente con el paquete;
          - marca `IsiVoltPro Preinspecciones BT` en textos legales y de ayuda;
          - subtítulo `PREINSPECCIONES BT` en el informe demo;
          - eliminación del teléfono de ejemplo y del correo de soporte obsoleto;
          - canal de comentarios de beta antes de publicar en Play Store;
          - pruebas de sincronización, servidor y compilación web;
          - sincronización Capacitor Android;
          - construcción de APK Android de depuración.
          EOF

      - name: Commit validated branding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx docs/product-branding-validation.md
          if git diff --cached --quiet; then
            echo 'Product branding is already validated.'
            exit 0
          fi
          git commit -m "brand: align visible Preinspecciones BT identity"
          git pull --rebase origin feat/apk-pc-sync-gps-close
          git push origin HEAD:feat/apk-pc-sync-gps-close
