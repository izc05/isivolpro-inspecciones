name: Validate mini PC deployment tooling

on:
  push:
    branches:
      - feat/apk-pc-sync-gps-close
    paths:
      - server/pocketbase/deploy/**
      - server/pocketbase/pb_hooks/**
      - server/pocketbase/pb_migrations/**
      - scripts/verify-deployment-assets.mjs
      - package.json
      - .github/workflows/validate-deployment-tooling.yml
  workflow_dispatch:

concurrency:
  group: isivoltpro-bt-deployment-tooling
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/apk-pc-sync-gps-close
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate PocketBase and deployment assets
        run: npm run test:server

      - name: Check repository diff
        run: git diff --check

      - name: Write deployment readiness marker
        shell: bash
        run: |
          cat > docs/deployment-tooling-validation.md <<'EOF'
          # Validación · Herramientas de despliegue del mini PC

          Estado: **SUPERADA**

          Se ha comprobado automáticamente:

          - sintaxis estricta de migraciones y hooks PocketBase;
          - sintaxis de todos los scripts shell de despliegue;
          - instalador con migraciones y archivo de variables protegido;
          - unidad systemd limitada a `127.0.0.1:8091` y endurecida;
          - plantilla Firebase sin credenciales reales;
          - plantilla Cloudflare Tunnel con regla final `http_status:404`;
          - preflight operativo para servicio, permisos, salud local y HTTPS público;
          - documentación del procedimiento y criterio para no fusionar antes de la prueba real.

          Esta validación certifica las herramientas del repositorio. No sustituye la ejecución del preflight en el mini PC real.
          EOF

      - name: Commit validation marker
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deployment-tooling-validation.md
          if git diff --cached --quiet; then
            echo "Deployment tooling marker already up to date."
            exit 0
          fi
          git commit -m "docs: validate mini PC deployment tooling"
          git pull --rebase origin feat/apk-pc-sync-gps-close
          git push origin HEAD:feat/apk-pc-sync-gps-close
