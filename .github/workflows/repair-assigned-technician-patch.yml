name: Repair assigned technician patch

on:
  workflow_dispatch:
  push:
    branches:
      - feat/apk-pc-sync-gps-close
    paths:
      - scripts/repair-assigned-technician-patch.mjs
      - .github/workflows/repair-assigned-technician-patch.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/apk-pc-sync-gps-close
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair and verify patch
        run: |
          set -Eeuo pipefail
          node scripts/repair-assigned-technician-patch.mjs
          node --check scripts/add-assigned-technician-visibility.mjs
          rm scripts/repair-assigned-technician-patch.mjs
          rm .github/workflows/repair-assigned-technician-patch.yml
          git diff --check

      - name: Commit repaired patch
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/add-assigned-technician-visibility.mjs scripts/repair-assigned-technician-patch.mjs .github/workflows/repair-assigned-technician-patch.yml
          git commit -m "fix: repair assigned technician visibility patch syntax"
          for attempt in 1 2 3; do
            git pull --rebase origin feat/apk-pc-sync-gps-close
            if git push origin HEAD:feat/apk-pc-sync-gps-close; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
