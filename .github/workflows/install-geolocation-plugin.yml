name: Install geolocation plugin

on:
  push:
    branches:
      - feat/apk-pc-sync-gps-close
    paths:
      - .github/workflows/install-geolocation-plugin.yml
  workflow_dispatch:

concurrency:
  group: isivoltpro-bt-geolocation-install
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  install-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/apk-pc-sync-gps-close
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install existing dependencies
        run: npm ci

      - name: Install Capacitor Geolocation
        run: npm install --save-exact @capacitor/geolocation@8.2.0

      - name: Configure Android location permissions
        run: node scripts/configure-android-geolocation.mjs

      - name: Test synchronization, closure and GPS contracts
        run: npm run test:sync

      - name: Validate server scripts
        run: npm run test:server

      - name: Build web application
        run: npm run build

      - name: Synchronize Android project
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Check diff
        run: git diff --check

      - name: Commit validated native integration
        run: |
          if git diff --quiet; then
            echo "Geolocation plugin was already installed and configured."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json android
          git commit -m "feat: install native geolocation support"
          git pull --rebase origin feat/apk-pc-sync-gps-close
          git push origin HEAD:feat/apk-pc-sync-gps-close
