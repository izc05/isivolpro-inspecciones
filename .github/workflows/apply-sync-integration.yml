name: Apply sync integration

on:
  push:
    branches:
      - feat/apk-pc-sync-gps-close
    paths:
      - src/App.jsx
      - src/sync/**
      - server/pocketbase/**
      - scripts/integrate-sync-app.mjs
      - scripts/integrate-sync-runtime.mjs
      - scripts/integrate-sync-pull.mjs
      - scripts/integrate-sync-status-ui.mjs
      - package.json
      - package-lock.json
      - .github/workflows/apply-sync-integration.yml

concurrency:
  group: isivoltpro-bt-sync-integration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/apk-pc-sync-gps-close
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded local metadata integration
        run: node scripts/integrate-sync-app.mjs

      - name: Apply guarded automatic sync integration
        run: node scripts/integrate-sync-runtime.mjs

      - name: Apply guarded remote pull integration
        run: node scripts/integrate-sync-pull.mjs

      - name: Apply guarded sync status UI integration
        run: node scripts/integrate-sync-status-ui.mjs

      - name: Test synchronization contracts
        run: npm run test:sync

      - name: Validate PocketBase scripts
        run: npm run test:server

      - name: Build application
        run: npm run build

      - name: Check diff
        run: git diff --check

      - name: Commit validated integration
        run: |
          if git diff --quiet; then
            echo "No integration changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "feat: integrate bidirectional inspection sync UI"
          git push origin HEAD:feat/apk-pc-sync-gps-close
