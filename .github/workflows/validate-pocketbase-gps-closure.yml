name: Validate PocketBase GPS closure

on:
  push:
    branches:
      - feat/apk-pc-sync-gps-close
    paths:
      - .github/workflows/validate-pocketbase-gps-closure.yml
  workflow_dispatch:

concurrency:
  group: isivoltpro-bt-pocketbase-gps-closure
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/apk-pc-sync-gps-close
          fetch-depth: 0

      - name: Resolve and download official PocketBase
        id: pocketbase
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="$(curl -fsSL https://api.github.com/repos/pocketbase/pocketbase/releases/latest | jq -r '.tag_name')"
          version="${tag#v}"
          test -n "$version"
          test "$version" != "null"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          curl -fsSL \
            "https://github.com/pocketbase/pocketbase/releases/download/v${version}/pocketbase_${version}_linux_amd64.zip" \
            -o /tmp/pocketbase.zip
          mkdir -p /tmp/pocketbase-closure
          unzip -q /tmp/pocketbase.zip -d /tmp/pocketbase-closure
          chmod +x /tmp/pocketbase-closure/pocketbase

      - name: Prepare hardened hooks and migrations
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/secure-pocketbase-closure-defaults.mjs
          node scripts/secure-pocketbase-closure-location.mjs
          node scripts/extend-pocketbase-sync-closure-config.mjs
          node scripts/harden-pocketbase-file-sync.mjs
          node scripts/normalize-pocketbase-hooks-es5.mjs
          cp -a server/pocketbase/pb_hooks /tmp/pocketbase-closure/
          cp -a server/pocketbase/pb_migrations /tmp/pocketbase-closure/
          mkdir -p /tmp/pocketbase-closure/pb_data

      - name: Apply migrations and create superuser
        working-directory: /tmp/pocketbase-closure
        env:
          FIREBASE_WEB_API_KEY: closure-validation-placeholder
        shell: bash
        run: |
          set -Eeuo pipefail
          ./pocketbase migrate up
          ./pocketbase superuser create root@example.test 'Closure-Validation-Password-2026!'

      - name: Start isolated PocketBase
        working-directory: /tmp/pocketbase-closure
        env:
          FIREBASE_WEB_API_KEY: closure-validation-placeholder
        shell: bash
        run: |
          set -Eeuo pipefail
          ./pocketbase serve --http=127.0.0.1:8102 > /tmp/pocketbase-closure.log 2>&1 &
          echo $! > /tmp/pocketbase-closure.pid
          for attempt in $(seq 1 30); do
            if curl -fsSL http://127.0.0.1:8102/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pocketbase-closure.log >&2
          exit 1

      - name: Create isolated admin account
        shell: bash
        run: |
          set -Eeuo pipefail
          root_token="$(curl -fsSL \
            -H 'Content-Type: application/json' \
            -d '{"identity":"root@example.test","password":"Closure-Validation-Password-2026!"}' \
            http://127.0.0.1:8102/api/collections/_superusers/auth-with-password | jq -r '.token')"
          company="$(curl -fsSL \
            -H "Authorization: $root_token" \
            -H 'Content-Type: application/json' \
            -d '{"name":"Empresa Cierre","slug":"empresa-cierre","active":true,"applications":["preinspecciones-bt"],"closurePolicy":{"allowCloseFromWeb":false,"requireMobileClose":true,"requireLocation":true,"allowedRadiusMeters":100,"maximumAccuracyMeters":30,"requireInspectorSignature":true,"requireClientSignature":false,"minimumPhotoCount":1,"requireServerSyncBeforeClose":true,"allowAdminOverride":true}}' \
            http://127.0.0.1:8102/api/collections/companies/records)"
          company_id="$(jq -r '.id' <<<"$company")"
          curl -fsSL \
            -H "Authorization: $root_token" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"admin@example.test\",\"password\":\"Admin-Closure-Password-2026!\",\"passwordConfirm\":\"Admin-Closure-Password-2026!\",\"verified\":true,\"company\":\"$company_id\",\"name\":\"Administrador\",\"role\":\"admin\",\"active\":true,\"applications\":[\"preinspecciones-bt\"]}" \
            http://127.0.0.1:8102/api/collections/users/records >/tmp/closure-user.json
          user_token="$(curl -fsSL \
            -H 'Content-Type: application/json' \
            -d '{"identity":"admin@example.test","password":"Admin-Closure-Password-2026!"}' \
            http://127.0.0.1:8102/api/collections/users/auth-with-password | jq -r '.token')"
          printf '%s' "$user_token" >/tmp/closure-user-token

      - name: Create inspection and protected closure configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          token="$(cat /tmp/closure-user-token)"
          now="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          body="$(jq -n \
            --arg now "$now" \
            '{contractVersion:2,inspectionId:"inspection-gps-e2e",revision:1,baseRevision:0,deviceId:"android-gps-e2e",sentAt:$now,metadata:{inspectionId:"inspection-gps-e2e",status:"IN_PROGRESS",updatedAt:$now,deletedAt:null},inspection:{id:"local-gps-e2e",data:{name:"Instalación GPS E2E"},responses:{},fieldSheets:[],signatures:{inspector:{signedAt:$now},client:null},selectedBlocks:[],measurements:{},calculations:{}}}')"
          synced="$(curl -fsSL \
            -H "Authorization: $token" \
            -H 'Content-Type: application/json' \
            -d "$body" \
            http://127.0.0.1:8102/api/isivolt/v1/inspections/sync)"
          inspection_record_id="$(jq -r '.recordId' <<<"$synced")"
          test "$(jq -r '.revision' <<<"$synced")" -eq 1
          printf '%s' "$inspection_record_id" >/tmp/gps-inspection-record-id

          config="$(curl -fsSL -X PUT \
            -H "Authorization: $token" \
            -H 'Content-Type: application/json' \
            -d '{"baseRevision":1,"latitude":37.1773,"longitude":-3.5986,"allowedRadiusMeters":100,"policy":{"allowCloseFromWeb":false,"requireMobileClose":true,"requireLocation":true,"allowedRadiusMeters":100,"maximumAccuracyMeters":30,"requireInspectorSignature":true,"requireClientSignature":false,"minimumPhotoCount":1,"requireServerSyncBeforeClose":true,"allowAdminOverride":true}}' \
            http://127.0.0.1:8102/api/isivolt/v1/inspections/inspection-gps-e2e/closure-config)"
          test "$(jq -r '.serverRevision' <<<"$config")" -eq 2
          jq -e '.latitude == 37.1773 and .longitude == -3.5986 and .allowedRadiusMeters == 100' <<<"$config"

      - name: Confirm closure is rejected until the photo is synchronized
        shell: bash
        run: |
          set -Eeuo pipefail
          token="$(cat /tmp/closure-user-token)"
          captured="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          close_body="$(jq -n \
            --arg captured "$captured" \
            '{baseRevision:2,deviceId:"android-gps-e2e",platform:"android",evidence:{latitude:37.17735,longitude:-3.59855,accuracyMeters:8,capturedAtDevice:$captured},overrideReason:"",capturedAtDevice:$captured}')"
          status="$(curl -sS -o /tmp/close-without-photo.json -w '%{http_code}' \
            -H "Authorization: $token" \
            -H 'Content-Type: application/json' \
            -d "$close_body" \
            http://127.0.0.1:8102/api/isivolt/v1/inspections/inspection-gps-e2e/close)"
          test "$status" -eq 422
          jq -e '.code == "CLOSURE_REQUIREMENTS_NOT_MET" and (.requirements.missing | index("MINIMUM_PHOTOS_REQUIRED") != null)' /tmp/close-without-photo.json

      - name: Upload synchronized image evidence and close on site
        shell: bash
        run: |
          set -Eeuo pipefail
          token="$(cat /tmp/closure-user-token)"
          inspection_record_id="$(cat /tmp/gps-inspection-record-id)"
          printf 'imagen simulada para cierre GPS\n' >/tmp/cierre.jpg
          sha="$(sha256sum /tmp/cierre.jpg | awk '{print $1}')"
          now="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"

          curl -fsSL \
            -H "Authorization: $token" \
            -F "inspection=$inspection_record_id" \
            -F 'inspectionId=inspection-gps-e2e' \
            -F 'syncFileId=gps-photo-e2e' \
            -F 'sourceDeviceId=android-gps-e2e' \
            -F 'linkedType=checklistPoint' \
            -F 'linkedId=point-gps' \
            -F 'fileName=cierre.jpg' \
            -F 'fileType=image' \
            -F 'mimeType=image/jpeg' \
            -F "sizeBytes=$(stat -c%s /tmp/cierre.jpg)" \
            -F "sha256=$sha" \
            -F "clientCreatedAt=$now" \
            -F 'blob=@/tmp/cierre.jpg;type=image/jpeg' \
            http://127.0.0.1:8102/api/collections/inspection_files/records >/tmp/uploaded-gps-photo.json

          close_body="$(jq -n \
            --arg captured "$now" \
            '{baseRevision:2,deviceId:"android-gps-e2e",platform:"android",evidence:{latitude:37.17735,longitude:-3.59855,accuracyMeters:8,capturedAtDevice:$captured},overrideReason:"",capturedAtDevice:$captured}')"
          closed="$(curl -fsSL \
            -H "Authorization: $token" \
            -H 'Content-Type: application/json' \
            -d "$close_body" \
            http://127.0.0.1:8102/api/isivolt/v1/inspections/inspection-gps-e2e/close)"
          jq -e '.status == "CLOSED" and .result == "VALIDATED" and .revision == 3' <<<"$closed"
          jq -e '.evidence.distanceMeters < 100 and .evidence.accuracyMeters == 8' <<<"$closed"

          closures="$(curl -fsSL -H "Authorization: $token" \
            'http://127.0.0.1:8102/api/collections/inspection_closures/records?page=1&perPage=20&skipTotal=1')"
          test "$(jq '.items | length' <<<"$closures")" -eq 1
          jq -e '.items[0].inspectionId == "inspection-gps-e2e" and .items[0].result == "VALIDATED"' <<<"$closures"

      - name: Stop isolated PocketBase
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/pocketbase-closure.pid ]]; then
            kill "$(cat /tmp/pocketbase-closure.pid)" >/dev/null 2>&1 || true
          fi

      - name: Write GPS closure validation marker
        shell: bash
        run: |
          cat > docs/pocketbase-gps-closure-validation.md <<EOF
          # Validación real de cierre GPS

          Estado: **SUPERADA**

          Versión oficial probada: **${{ steps.pocketbase.outputs.tag }}**

          La prueba ha confirmado en un PocketBase real:

          - creación y sincronización de una preinspección;
          - configuración protegida de coordenadas y radio por un administrador;
          - rechazo del cierre sin la fotografía obligatoria sincronizada;
          - subida protegida de una evidencia de imagen;
          - recálculo servidor de distancia y precisión GPS;
          - cierre desde plataforma Android dentro del radio permitido;
          - incremento correcto de revisión;
          - registro independiente en `inspection_closures`;
          - evidencia auditable con coordenadas, distancia y precisión.

          Las coordenadas y archivos usados eran datos temporales exclusivos de GitHub Actions.
          EOF

      - name: Commit GPS closure validation marker
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pocketbase-gps-closure-validation.md server/pocketbase/pb_hooks/*.js
          if git diff --cached --quiet; then
            echo "GPS closure was already validated."
            exit 0
          fi
          git commit -m "test: validate real GPS closure"
          git pull --rebase origin feat/apk-pc-sync-gps-close
          git push origin HEAD:feat/apk-pc-sync-gps-close
