name: Finalize connected inspections v2

on:
  push:
    branches:
      - feat/apk-pc-sync-gps-close
    paths:
      - .github/workflows/finalize-connected-inspections-v2.yml
  workflow_dispatch:

concurrency:
  group: isivoltpro-bt-final-connected-validation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/apk-pc-sync-gps-close
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Mount consolidated connected workspace
        run: node scripts/integrate-connected-bridge.mjs

      - name: Protect closure fields for inspectors
        run: node scripts/secure-closure-modal-fields.mjs

      - name: Apply secure server closure defaults
        run: node scripts/secure-pocketbase-closure-defaults.mjs

      - name: Use administrator-trusted closure coordinates
        run: node scripts/secure-pocketbase-closure-location.mjs

      - name: Include trusted closure configuration in sync responses
        run: node scripts/extend-pocketbase-sync-closure-config.mjs

      - name: Normalize PocketBase hooks for ES5 runtime
        run: node scripts/normalize-pocketbase-hooks-es5.mjs

      - name: Test synchronization, administration and GPS closure
        run: npm run test:sync

      - name: Validate PocketBase migrations, hooks and deployment scripts
        run: npm run test:server

      - name: Build web application
        run: npm run build

      - name: Synchronize Capacitor Android
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Check generated diff
        run: git diff --check

      - name: Write validation marker
        run: |
          cat > docs/final-connected-validation.md <<'EOF'
          # Validación final · Preinspecciones BT conectadas

          Estado: **SUPERADA**

          La rama `feat/apk-pc-sync-gps-close` ha superado conjuntamente:

          - pruebas de identificadores y revisiones;
          - cola offline y conflictos;
          - autenticación Firebase–PocketBase;
          - sincronización APK–PC bidireccional;
          - políticas administrativas protegidas;
          - cálculo de distancia y precisión GPS;
          - cierre presencial auditado;
          - validación de migraciones y hooks PocketBase;
          - compilación web de producción;
          - sincronización Capacitor Android;
          - construcción de APK Android de depuración.

          Este marcador no significa que PocketBase ya esté desplegado en el mini PC; confirma que el código y las compilaciones de la rama han pasado la validación automatizada.
          EOF

      - name: Commit validated connected integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/closure/ClosureModals.jsx server/pocketbase/pb_hooks android docs/final-connected-validation.md
          if git diff --cached --quiet; then
            echo "Connected inspections were already fully validated."
            exit 0
          fi
          git commit -m "feat: validate connected inspections and GPS closure"
          git pull --rebase origin feat/apk-pc-sync-gps-close
          git push origin HEAD:feat/apk-pc-sync-gps-close
